name: quantum

on:
  push:
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"
  pull_request:
    paths:
      - "quantum-agent/**"

jobs:
  green:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-agent
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: quantum-agent
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install
      - name: mise run green
        run: mise run green

  docker:
    needs: green
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./quantum-agent/docker
          push: true
          tags: ghcr.io/${{ github.repository }}/quantum-agent:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/quantum-agent:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/quantum-agent:buildcache,mode=max
