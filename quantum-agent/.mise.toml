# Quantum Agent toolchain — single source of truth
# Run `mise install` to get all of these.

[tools]
node    = "26"
python  = "3.14"
pnpm    = "latest"
biome   = "latest"
deno    = "latest"
uv      = "latest"
gh      = "latest"
sccache = "latest"

[settings]
experimental = true

[env]
QUANTUM_HOME = "{{config_root}}/.quantum"
NODE_OPTIONS = "--enable-source-maps"
SCCACHE_DIR  = "{{env.HOME}}/.cache/sccache"
RUSTC_WRAPPER = "sccache"

[tasks.dev]
description = "Run the CLI in watch mode"
run         = "tsx watch src/cli.ts"

[tasks.build]
description = "Type-check"
run         = "tsc -p tsconfig.json --noEmit"

[tasks.test]
description = "Run the test suite"
run         = "vitest run"

[tasks.verify]
description = "Run quantum verify (README contract)"
run         = "tsx src/cli.ts verify"

[tasks.lint]
description = "Lint + format with Biome"
run         = "biome check . --write"

[tasks.green]
description = "lint + test + verify (the merge gate)"
depends     = ["lint", "build", "test", "verify"]

[tasks.doctor]
description = "Diagnose the install"
run         = "tsx src/cli.ts doctor"

[tasks.serve]
description = "Run the local MCP/HTTP server"
run         = "tsx src/cli.ts serve --mcp"
