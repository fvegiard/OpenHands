# Quantum Agent — skill sources
# `quantum skill install --pack <name>` resolves through these. These are Git
# repositories you can install from; counts (if any) belong to the upstream
# projects and are NOT verified or aggregated by Quantum.

[[source]]
name        = "alirezarezvani"
type        = "git"
description = "Claude Code skills (upstream project)"
url         = "https://github.com/alirezarezvani/claude-skills"

[[source]]
name        = "awesome-claude-code-toolkit"
type        = "git"
description = "Claude Code agents + skills (upstream project)"
url         = "https://github.com/rohitg00/awesome-claude-code-toolkit"

[[source]]
name        = "voltagent-openclaw"
type        = "git"
description = "OpenClaw skills (upstream project)"
url         = "https://github.com/VoltAgent/awesome-openclaw-skills"

[[source]]
name        = "composio"
type        = "git"
description = "Curated Claude skills (upstream project)"
url         = "https://github.com/ComposioHQ/awesome-claude-skills"

[[source]]
name        = "local"
type        = "filesystem"
description = "User-defined local skills"
path        = "./skills-core"

[packs]
default            = ["claude-code-essentials", "alirezarezvani-engineering", "quantum-core"]
"openclaw-essentials" = ["voltagent-openclaw"]
"claude-code-essentials" = ["awesome-claude-code-toolkit"]
"alirezarezvani-engineering" = ["alirezarezvani"]
"quantum-core" = ["local"]
