# Quantum Agent — skill sources
# `quantum skill install --pack <name>` resolves through these.

[[source]]
name        = "skillkit"
type        = "skillkit"
description = "Cross-agent package manager — 400 000+ skills across 31 upstreams"
command     = "skillkit"

[[source]]
name        = "clawhub"
type        = "http"
description = "OpenClaw's official skill registry — 13 729 skills"
url         = "https://clawhub.dev/api/v1"

[[source]]
name        = "alirezarezvani"
type        = "git"
description = "232+ Claude Code skills across 9 domains"
url         = "https://github.com/alirezarezvani/claude-skills"

[[source]]
name        = "awesome-claude-code-toolkit"
type        = "git"
description = "135 agents + 35 curated skills + 14 MCP configs"
url         = "https://github.com/rohitg00/awesome-claude-code-toolkit"

[[source]]
name        = "voltagent-openclaw"
type        = "git"
description = "5 400+ filtered OpenClaw skills"
url         = "https://github.com/VoltAgent/awesome-openclaw-skills"

[[source]]
name        = "composio"
type        = "git"
description = "Curated Claude skills"
url         = "https://github.com/ComposioHQ/awesome-claude-skills"

[[source]]
name        = "local"
type        = "filesystem"
description = "User-defined skills"
path        = "./skills-core"

[packs]
default            = ["claude-code-essentials", "alirezarezvani-engineering", "quantum-core"]
"openclaw-essentials" = ["voltagent-openclaw"]
"claude-code-essentials" = ["awesome-claude-code-toolkit"]
"alirezarezvani-engineering" = ["alirezarezvani"]
"quantum-core" = ["local"]
