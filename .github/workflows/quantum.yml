name: quantum

on:
  push:
    branches: [main, dev4]
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"
  pull_request:
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"

defaults:
  run:
    working-directory: quantum-agent

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnostics
        run: |
          node --version
          pnpm --version
          which node && which pnpm
          ls -la
          ls -la ../.github/workflows/
          cat package.json | head -20
          head -5 pnpm-lock.yaml
      - name: Install deps (non-frozen for triage)
        run: pnpm install --no-frozen-lockfile
      - name: Rebuild native modules
        run: pnpm rebuild better-sqlite3 || true
      - name: Lint (biome)
        run: pnpm exec biome check .
      - name: Type-check
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: Test
        run: pnpm exec vitest run
      - name: Verify README contract
        run: pnpm exec tsx src/cli.ts verify

  docker:
    needs: green
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./quantum-agent
          file: ./quantum-agent/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/quantum-agent:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/quantum-agent:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/quantum-agent:buildcache,mode=max
