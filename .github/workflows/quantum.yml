name: quantum

on:
  push:
    branches: [main, dev4]
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"
  pull_request:
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"

defaults:
  run:
    working-directory: quantum-agent
    shell: bash

jobs:
  # Required stable lane: Node 22.12+ (the supported default). Deterministic
  # frozen-lockfile install + the full green gate (lint, typecheck, test,
  # README verify).
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: quantum-agent/pnpm-lock.yaml

      - name: Enable corepack (pnpm@10.18.2 from packageManager)
        run: corepack enable && corepack prepare pnpm@10.18.2 --activate

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (biome, zero warnings)
        run: ./node_modules/.bin/biome check .

      - name: Type-check (tsc)
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit

      - name: Test (vitest)
        run: ./node_modules/.bin/vitest run

      - name: Verify README contract
        run: ./node_modules/.bin/tsx src/cli.ts verify

  # Full compatibility lane: Node 26. Runs the identical suite but does not gate
  # the merge (Node 26 is not the supported default). Do not claim Node 26
  # support unless this lane is green.
  green-node26-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: corepack enable && corepack prepare pnpm@10.18.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/biome check .
      - run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit
      - run: ./node_modules/.bin/vitest run
      - run: ./node_modules/.bin/tsx src/cli.ts verify
