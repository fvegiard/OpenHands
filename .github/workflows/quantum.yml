name: quantum

on:
  push:
    branches: [main, dev4]
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"
  pull_request:
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"

defaults:
  run:
    working-directory: quantum-agent
    shell: bash

jobs:
  # Required stable lane: Node 22.12+ (the supported default). Deterministic
  # frozen-lockfile install + the full green gate (lint, typecheck, test,
  # README verify).
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # pnpm (repo-pinned) MUST be installed before setup-node initializes its
      # pnpm cache, otherwise setup-node fails with "Unable to locate executable
      # file: pnpm".
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      # Pinned Node 22 LTS. The code uses the built-in node:sqlite module, which
      # exists on 22.12 only behind --experimental-sqlite and is unflagged from
      # 22.13.0 onward. We do NOT add the experimental flag; instead we pin the
      # current 22 LTS (>= 22.13). Engine minimum is declared as >=22.13.0.
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: quantum-agent/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (biome, zero warnings)
        run: pnpm exec biome check .

      - name: Type-check (tsc)
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Test (vitest)
        run: pnpm exec vitest run

      - name: Verify README contract
        run: pnpm exec tsx src/cli.ts verify

  # Full compatibility lane: Node 26 on Linux. Identical suite; non-gating.
  green-node26-compat:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: quantum-agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec tsx src/cli.ts verify

  # Explicit Windows + Node 26 compatibility lane — the exact environment the
  # operator reported failures in (Windows 11 / Node 26). Non-gating (Node 26 is
  # not the supported default), but it validates the cross-platform path fixes
  # (permissions/sources) and the git-clone no-prompt fix. biome runs in check
  # mode only (never --write) so CI is non-mutating.
  green-windows-node26-compat:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: quantum-agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec tsx src/cli.ts verify
