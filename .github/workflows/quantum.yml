name: quantum

on:
  push:
    branches: [main, dev4]
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"
  pull_request:
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"

defaults:
  run:
    working-directory: quantum-agent
    shell: bash

jobs:
  green:
    runs-on: ubuntu-latest
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_PYTHON_GITHUB_ATTESTATIONS: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Install mise + toolchain (.mise.toml)
        uses: jdx/mise-action@v2
        with:
          version: 2026.5.5
          experimental: true
          install_dir: ${{ github.workspace }}/quantum-agent
          working_directory: quantum-agent

      - name: Verify toolchain
        run: |
          which pnpm && pnpm --version
          which node && node --version
          which biome 2>/dev/null && biome --version || true

      - name: pnpm install
        run: pnpm install --no-frozen-lockfile

      - name: Lint (biome)
        run: ./node_modules/.bin/biome check .

      - name: Type-check (tsc)
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit

      - name: Test (vitest)
        run: ./node_modules/.bin/vitest run

      - name: Verify README contract
        run: ./node_modules/.bin/tsx src/cli.ts verify
