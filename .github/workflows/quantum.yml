name: quantum

on:
  push:
    branches: [main, dev4]
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"
  pull_request:
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"

defaults:
  run:
    working-directory: quantum-agent
    shell: bash

jobs:
  green:
    runs-on: ubuntu-latest
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_PYTHON_GITHUB_ATTESTATIONS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install mise + toolchain (.mise.toml)
        uses: jdx/mise-action@v2
        with:
          version: 2026.5.5
          experimental: true
          install_dir: ${{ github.workspace }}/quantum-agent
          working_directory: quantum-agent

      - name: Activate pnpm 10 via corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@10.18.2 --activate
          pnpm --version

      - name: pnpm install (resolves fresh; lockfile is from an earlier toolchain)
        run: pnpm install --no-frozen-lockfile

      - name: Lint (biome)
        run: ./node_modules/.bin/biome check .

      - name: Type-check (tsc)
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit

      - name: Test (vitest)
        run: ./node_modules/.bin/vitest run

      - name: Verify README contract
        run: ./node_modules/.bin/tsx src/cli.ts verify

  docker:
    needs: green
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./quantum-agent
          file: ./quantum-agent/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/quantum-agent:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/quantum-agent:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/quantum-agent:buildcache,mode=max
