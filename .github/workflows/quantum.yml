name: quantum

on:
  push:
    branches: [main, dev4]
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"
  pull_request:
    paths:
      - "quantum-agent/**"
      - ".github/workflows/quantum.yml"

defaults:
  run:
    working-directory: quantum-agent
    shell: bash

env:
  NODE_OPTIONS: "--disable-warning=DEP0205"

jobs:
  # Required stable lane: Node 22.12+ (the supported default). Deterministic
  # frozen-lockfile install + the full green gate (lint, typecheck, test,
  # README verify).
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # pnpm (repo-pinned) MUST be installed before setup-node initializes its
      # pnpm cache, otherwise setup-node fails with "Unable to locate executable
      # file: pnpm".
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2

      # Pinned Node 22 LTS. The code uses the built-in node:sqlite module, which
      # exists on 22.12 only behind --experimental-sqlite and is unflagged from
      # 22.13.0 onward. We do NOT add the experimental flag; instead we pin the
      # current 22 LTS (>= 22.13). Engine minimum is declared as >=22.13.0.
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: quantum-agent/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (biome, zero warnings)
        run: pnpm exec biome check .

      - name: Type-check (tsc)
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Test (vitest, JSON results for the capability gate)
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.vitest-results.json

      - name: Verify README contract + capability evidence (current-run results)
        run: pnpm exec tsx src/cli.ts verify --capabilities-results .vitest-results.json --require-results

  green-node26-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: quantum-agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.vitest-results.json
      - run: pnpm exec tsx src/cli.ts verify --capabilities-results .vitest-results.json --require-results

  green-windows-node26-compat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.2
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: quantum-agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.vitest-results.json
      - run: pnpm exec tsx src/cli.ts verify --capabilities-results .vitest-results.json --require-results
