name: Probe7 env
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    if: github.repository_owner == 'fvegiard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Step with env
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM: OpenHands/OpenHands
          UPSTREAM_BRANCH: main
          SYNC_BRANCH_NAME: sync/upstream-auto
        run: |
          set -euo pipefail
          echo "$GH_REPO $SYNC_BRANCH $UPSTREAM"
