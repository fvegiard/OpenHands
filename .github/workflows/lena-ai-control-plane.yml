name: Lena AI control plane

on:
  pull_request:
    paths:
      - ".agents/skills/lena-ai-control-plane/**"
      - "agents/lena-ia/**"
      - "integrations/lena-ai/**"
      - ".github/workflows/lena-ai-control-plane.yml"
  push:
    branches:
      - "feat/lena-ai-control-plane"
    paths:
      - ".agents/skills/lena-ai-control-plane/**"
      - "agents/lena-ia/**"
      - "integrations/lena-ai/**"
      - ".github/workflows/lena-ai-control-plane.yml"

permissions:
  contents: read

jobs:
  contracts-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check integrations/lena-ai/cloudflare/src/index.mjs
      - name: Webhook gateway tests
        run: node --test integrations/lena-ai/cloudflare/test/index.test.mjs
      - name: Contracts and migration safety tests
        run: node --test integrations/lena-ai/test/contracts.test.mjs
