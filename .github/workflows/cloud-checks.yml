name: cloud-checks

# Lightweight gate for the openhands-cloud control surface and the .agents/skills
# registry. Backend unit tests (including tests/unit/app_server) run in
# py-tests.yml; the quantum-agent suite runs in quantum.yml. This workflow only
# covers the scopes those two do not: the doctor CLI script and skill format.
on:
  push:
    branches: [main]
    paths:
      - "scripts/openhands-cloud"
      - ".agents/skills/**"
      - ".github/workflows/cloud-checks.yml"
  pull_request:
    paths:
      - "scripts/openhands-cloud"
      - "scripts/check-repo-isolation.py"
      - ".agents/skills/**"
      - ".github/workflows/**"

jobs:
  cloud-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Repository isolation gate: fails if a writable upstream remote is added,
      # sync-upstream.yml reappears, or any workflow does an upstream merge/push
      # (including a scheduled one).
      - name: Repository isolation
        run: python3 scripts/check-repo-isolation.py

      # Real gate (no masking): default severity, non-zero on ANY finding.
      # ubuntu-latest ships shellcheck, so no apt-get is needed.
      - name: Shellcheck (real gate, zero findings)
        run: |
          shellcheck --version
          bash -n scripts/openhands-cloud
          shellcheck scripts/openhands-cloud

      - name: CLI help + skill-validate self-test
        run: |
          scripts/openhands-cloud help
          # Every committed .agents/skills SKILL.md must pass format validation.
          fail=0
          while IFS= read -r -d '' f; do
            scripts/openhands-cloud skill-validate "$f" || fail=1
          done < <(find .agents/skills -name SKILL.md -print0)
          exit "$fail"
