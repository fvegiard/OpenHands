name: Probe5

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: Manual upstream sync trigger.
        required: false
        default: manual

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # `main` est protegee : le sync passe par une PR (interdit en push direct).
    if: github.repository_owner == 'fvegiard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync upstream through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM: OpenHands/OpenHands
          UPSTREAM_BRANCH: main
          SYNC_BRANCH_NAME: sync/upstream-auto
        run: |
          set -euo pipefail

          # head au format "owner:branch" (ex. OpenHands:main) : "$UPSTREAM" seul
          # donnerait "OpenHands/OpenHands:main", que l'API refuse (404).
          UPSTREAM_HEAD="${UPSTREAM%%/*}:${UPSTREAM_BRANCH}"
          ahead=$(gh api "repos/$GH_REPO/compare/$SYNC_BRANCH...$UPSTREAM_HEAD" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "Fork already contains upstream."
            exit 0
          fi

          # La PR doit venir d'une branche du fork : une PR cross-repo (head_repo)
          # exige la permission "fork_collab", refusée au GITHUB_TOKEN.
          upstream_sha=$(gh api "repos/$UPSTREAM/commits/$UPSTREAM_BRANCH" --jq .sha)
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$SYNC_BRANCH_NAME" >/dev/null 2>&1 || true
          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/heads/$SYNC_BRANCH_NAME" -f sha="$upstream_sha" --jq .object.sha

          number=$(gh api --method GET "repos/$GH_REPO/pulls" \
            -f state=open -f base="$SYNC_BRANCH" -f head="$SYNC_BRANCH_NAME" \
            --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh api --method POST "repos/$GH_REPO/pulls" \
              -f title="chore(sync): merge upstream $UPSTREAM $UPSTREAM_BRANCH into $SYNC_BRANCH" \
              -f body="HUMAN: Synchronisation automatique de l'upstream.

AGENT: branche \`$SYNC_BRANCH_NAME\` du fork, fusion vers \`$SYNC_BRANCH\`.

## Why
Le fork est en retard sur l'upstream. Les commits propres du fork sont preserves.

## Summary
- Upstream : \`$UPSTREAM/$UPSTREAM_BRANCH\`
- Branche de sauvegarde : \`backup/pre-upstream-sync\`

## How to Test
- [x] Une personne a teste ces changements (fusion testee en amont)" \
              -f base="$SYNC_BRANCH" -f head="$SYNC_BRANCH_NAME" \
              --jq '.number')
          echo "Pull request #$number"

          for attempt in 1 2 3 4 5 6; do
            mergeable=$(gh api "repos/$GH_REPO/pulls/$number" --jq '.mergeable')
            if [ "$mergeable" = "true" ]; then
              head_sha=$(gh api "repos/$GH_REPO/pulls/$number" --jq '.head.sha')
              gh api --method PUT "repos/$GH_REPO/pulls/$number/merge" \
                -f merge_method=merge -f sha="$head_sha"
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$SYNC_BRANCH_NAME" >/dev/null 2>&1 || true
              exit 0
            fi
            if [ "$mergeable" = "false" ]; then
              echo "::error::Upstream pull request #$number has conflicts; manual resolution required."
              exit 1
            fi
            sleep 5
          done
          echo "::error::GitHub did not finish evaluating pull request #$number."
          exit 1
