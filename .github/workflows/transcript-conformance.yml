name: transcript-conformance

# No-drift + transcript-integrity + honest-scoring gate for the multi-agent
# experiment. Fails on contract drift, a missing/stale lane transcript, a hidden
# failed item, or a fabricated PASS. A lane that is NOT VERIFIED here cannot
# contribute code to integration.
on:
  push:
    branches: [main, agent/provider-neutral-autonomy, experiment/claude-agent, experiment/codex-agent, experiment/mavis-minimax-m3]
    paths:
      - "experiments/**"
      - "scripts/**"
      - "quantum-agent/**"
      - ".agents/skills/**"
      - ".github/workflows/transcript-conformance.yml"
  pull_request:
    paths:
      - "experiments/**"
      - "scripts/**"
      - "quantum-agent/**"
      - ".agents/skills/**"
      - ".github/workflows/transcript-conformance.yml"

jobs:
  # Fast, python-only gate: contract lock, red fixtures, committed-lane integrity.
  integrity:
    runs-on: ubuntu-latest
    steps:
      # Check out the BRANCH HEAD, not the synthetic PR merge ref, so lane
      # identity (head_sha) is exact on pull_request as well as push.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Contract lock integrity (frozen bundle unchanged)
        run: |
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          lock = json.loads(Path("experiments/contract.lock.json").read_text())
          files = {}
          for rel in lock["files"]:
              files[rel] = hashlib.sha256((Path("experiments") / rel).read_bytes()).hexdigest()
          manifest = {"contract_version": lock["contract_version"], "files": files}
          bundle = hashlib.sha256(json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          bad = [r for r in lock["files"] if files[r] != lock["files"][r]]
          if bad or bundle != lock["bundle_sha256"]:
              print("contract drift: frozen bundle hash mismatch", bad)
              sys.exit(1)
          print("contract lock OK:", bundle)
          PY

      - name: Red fixtures (validator rejects false confidence)
        run: python3 experiments/harness/test_transcript_gate.py

      - name: Red fixtures (comparator rejects unproven/ fabricated results)
        run: python3 experiments/harness/test_compare_lanes.py

      - name: Skill format lint (real command)
        run: python3 experiments/harness/skill_lint.py

      - name: Require + validate committed lane transcripts (integrity, audit)
        run: |
          set -e
          # The synthesis (cursor) lane MUST be present — absence is NOT a pass.
          python3 experiments/harness/validate_transcript.py --require-lane synthesis
          # Validate any other lane transcripts that exist for integrity/tamper.
          shopt -s nullglob
          for t in experiments/lanes/*/transcript.jsonl; do
            [ "$t" = "experiments/lanes/synthesis/transcript.jsonl" ] && continue
            echo "== $t =="
            python3 experiments/harness/validate_transcript.py --transcript "$t"
          done

  # Real at-head gate: regenerate the cursor lane from REAL commands at the
  # current HEAD, then require a PASS verdict bound to real passing evidence.
  regen-and-validate-head:
    runs-on: ubuntu-latest
    steps:
      # Exact-head checkout: on pull_request use the PR branch head SHA (never the
      # synthetic merge ref) so `git rev-parse HEAD` == the real lane head.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Setup Node (pinned LTS with node:sqlite)
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: quantum-agent/pnpm-lock.yaml

      - name: Install quantum-agent deps (frozen)
        working-directory: quantum-agent
        run: pnpm install --frozen-lockfile

      - name: Regenerate cursor lane at HEAD (real commands) and validate at-head
        run: |
          set -e
          HEAD_SHA="$(git rev-parse HEAD)"
          python3 experiments/harness/gen_transcript.py \
            --lane synthesis --agent cursor --model gpt-5-class --runtime cursor-cloud
          python3 experiments/harness/validate_transcript.py \
            --require-lane synthesis --require-head "$HEAD_SHA" --require-pass

      - name: "Superiority gate (enforce mode: fail on unproven superiority)"
        run: python3 experiments/harness/compare_lanes.py --enforce
