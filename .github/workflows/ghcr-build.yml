# Workflow that builds and pushes the OpenHands app and enterprise Docker images to ghcr.io.
# Per-image build logic lives in .github/workflows/_build-image.yml.
name: Docker

on:
  push:
    branches:
      - main
      - "saas-rel-*"
      - "oss-rel-*"
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: true
        default: ""

# PR events share a group so pushes supersede each other; each commit on a release branch gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
  cancel-in-progress: true

# Permission contract with the reusable ./.github/workflows/_build-image.yml,
# whose build/merge jobs request `packages: write`. GitHub validates a reusable
# call's requested permissions against the CALLER at startup — BEFORE evaluating
# the per-job `if:` — so without this block the caller only had the fork default
# (`packages: read`) and the whole Docker workflow failed at startup.
#
# Granting `packages: write` here does NOT enable publishing from this private
# fork: every build/push job below is gated with
# `github.repository == 'All-Hands-AI/OpenHands' && ...fork != true`, which is
# false here, so the reusable workflow is never invoked (no GHCR login, no push).
# This is the explicit no-publish path — the token scope only satisfies the
# reusable contract for jobs that never run on this repository.
permissions:
  contents: read
  packages: write

jobs:
  build_app:
    name: App
    if: github.repository == 'All-Hands-AI/OpenHands' && github.event.pull_request.head.repo.fork != true
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ghcr.io/fvegiard/openhands
      dockerfile: containers/app/Dockerfile

  build_enterprise:
    name: Enterprise
    if: github.repository == 'All-Hands-AI/OpenHands' && github.event.pull_request.head.repo.fork != true
    needs: build_app
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ghcr.io/fvegiard/enterprise-server
      dockerfile: enterprise/Dockerfile
      extra-build-args: OPENHANDS_VERSION=sha-${{ github.event.pull_request.head.sha || github.sha }}
      provenance: true
      sbom: true
      buildx-driver-opts: network=host

  update_pr_description:
    name: Update PR Description
    if: github.repository == 'All-Hands-AI/OpenHands' && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]'
    needs: build_app
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get short SHA
        id: short_sha
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: printf 'SHORT_SHA=%s\n' "${PR_HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Update PR Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHORT_SHA: ${{ steps.short_sha.outputs.SHORT_SHA }}
        shell: bash
        run: |
          echo "Updating PR description with Docker and uvx commands"
          bash "${GITHUB_WORKSPACE}/.github/scripts/update_pr_description.sh"
