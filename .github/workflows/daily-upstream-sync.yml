name: Daily upstream sync

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'fvegiard/OpenHands'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync upstream through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYNC_BRANCH: main
          UPSTREAM_HEAD: OpenHands:main
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/$GH_REPO/compare/$SYNC_BRANCH...$UPSTREAM_HEAD" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "Fork already contains upstream."
            exit 0
          fi
          number=$(gh api --method GET "repos/$GH_REPO/pulls" \
            -f state=open -f base="$SYNC_BRANCH" -f head="$UPSTREAM_HEAD" \
            --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh api --method POST "repos/$GH_REPO/pulls" \
              -f title="Sync with OpenHands upstream" \
              -f body="Daily upstream synchronization. Preserve fork changes and branch protection." \
              -f base="$SYNC_BRANCH" -f head="$UPSTREAM_HEAD" -f head_repo=OpenHands \
              --jq '.number')
          fi
          for attempt in 1 2 3; do
            mergeable=$(gh api "repos/$GH_REPO/pulls/$number" --jq '.mergeable')
            if [ "$mergeable" = "true" ]; then
              head_sha=$(gh api "repos/$GH_REPO/pulls/$number" --jq '.head.sha')
              gh api --method PUT "repos/$GH_REPO/pulls/$number/merge" \
                -f merge_method=merge -f sha="$head_sha"
              exit 0
            fi
            if [ "$mergeable" = "false" ]; then
              echo "::error::Upstream pull request #$number has conflicts; manual resolution required."
              exit 1
            fi
            sleep 5
          done
          echo "::error::GitHub did not finish evaluating pull request #$number."
          exit 1
