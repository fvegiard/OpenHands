[pytest]
addopts = -p no:warnings
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Les sous-projets sous mcp-servers/ ont leur propre pyproject et leur propre
# rootdir. Sans cette exclusion, un `pytest` nu lancé à la racine les collecte
# sous le mauvais rootdir et échoue à l'import. La CI n'est pas concernée
# (py-tests.yml cible ./tests/unit), mais un lancement local l'est.
norecursedirs = mcp-servers
